name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing to say about the commit that replaced it. Without this,
# pushing a fix leaves the old run holding a queue slot -- and a run stuck in `queued`
# means the newest commit never gets checked at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: pytest
