[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wroclaw-air-insights"
version = "0.1.0"
description = "Air quality analysis for Wrocław with a 24h PM2.5 forecast"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "jupyterlab>=4.2,<5",
]
# The page measurement in .claude/skills/verify-published-page drives headless Chromium over
# CDP. `websocket-client` arrives transitively through jupyter-server today, which is a
# dependency nobody declared and nobody controls: the tool would break the day that chain
# changes, at the moment it is being trusted to say whether the page shipped.
tools = [
    "websocket-client>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

# The published page inlines its own stylesheet, so the CSS is source the report module reads
# at import — an install that dropped it would fail at build time rather than render unstyled.
[tool.setuptools.package-data]
wroclaw_air_insights = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # numpy 2.5 / pandas date_range interaction — third-party, not our code.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # joblib's numpy pickling on NumPy 2.5 — third-party, not ours.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
